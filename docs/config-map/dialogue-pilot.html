<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>功能模块配置表 · 对话系统试点</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2329; --sub:#5b6168; --line:#e3e6eb;
    --blue:#3445db; --green:#1f9d55; --gray:#8a9099; --red:#d4392b; --amber:#d98300;
    --chip:#eef0f4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;}
  header{padding:18px 24px 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  h1{margin:0 0 4px;font-size:19px;font-weight:700;}
  .meta{color:var(--sub);font-size:12.5px;}
  .layout{display:flex;align-items:stretch;min-height:calc(100vh - 64px);}
  /* 左侧大模块导航 */
  .sidebar{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:14px 10px;overflow:auto;}
  .nav-title{font-size:11.5px;color:var(--sub);padding:4px 10px 8px;letter-spacing:.04em;}
  .nav-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;
    cursor:pointer;color:var(--ink);font-size:13.5px;margin-bottom:3px;user-select:none;}
  .nav-item:hover{background:#f0f3ff;}
  .nav-item.active{background:var(--blue);color:#fff;}
  .nav-item .cnt{font-size:11px;padding:1px 7px;border-radius:999px;background:#eef0f4;color:var(--sub);}
  .nav-item.active .cnt{background:rgba(255,255,255,.25);color:#fff;}
  .nav-item .cnt.todo{background:#fff3e0;color:var(--amber);}
  .nav-item.active .cnt.todo{background:rgba(255,255,255,.25);color:#fff;}
  /* 右侧主体 */
  .main{flex:1;padding:18px 24px 40px;overflow:auto;max-width:1100px;}
  .main h2{margin:0 0 2px;font-size:17px;}
  .main .sub{color:var(--sub);font-size:12.5px;margin-bottom:14px;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
  #search{padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:260px;font-size:13px;outline:none;}
  #search:focus{border-color:var(--blue);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--chip);
    color:var(--sub);cursor:pointer;font-size:12.5px;user-select:none;}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .count{color:var(--sub);font-size:12.5px;margin-left:auto;}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  th,td{padding:11px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);}
  th{background:#fafbfc;font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap;}
  tbody tr.row{cursor:pointer;}
  tbody tr.row:hover{background:#f7f9ff;}
  .name{font-weight:600;color:var(--ink);}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .b-active{background:#e6f6ed;color:var(--green);}
  .b-dormant{background:#fdecea;color:var(--red);}
  .b-nosrc{background:#fff3e0;color:var(--amber);}
  .b-none{background:#eef0f4;color:var(--gray);}
  .path{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:12px;color:#3445db;word-break:break-all;}
  .path.dim{color:var(--gray);}
  .detail td{background:#fbfcfe;padding:0;}
  .detail .inner{padding:14px 18px 16px;border-bottom:1px solid var(--line);}
  .detail h4{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:600;}
  .kv .k{color:var(--sub);font-size:12.5px;}
  .files{font-family:Consolas,Menlo,monospace;font-size:12px;color:#2b2f36;line-height:1.7;white-space:pre-wrap;}
  .note{background:#fff8e6;border:1px solid #f3e0a8;border-radius:8px;padding:9px 12px;color:#6b5300;font-size:12.5px;white-space:pre-wrap;}
  .todo-box{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--sub);}
  .todo-box b{color:var(--ink);}
  .footer{margin-top:22px;color:var(--sub);font-size:12px;line-height:1.7;}
  .footer code{background:#eef0f4;padding:1px 5px;border-radius:4px;}
</style>
</head>
<body>
<header>
  <h1>功能模块 · 配置表 / Lua / XML 映射</h1>
  <div class="meta">试点范围：剧情对话 5 子模块已填 · 其余大模块待梳理 · 数据 2026-09-13 代码静态审计 · 单文件离线版</div>
</header>

<div class="layout">
  <nav class="sidebar">
    <div class="nav-title">大模块</div>
    <div id="nav"></div>
  </nav>

  <div class="main">
    <h2 id="mTitle"></h2>
    <div class="sub" id="mSub"></div>
    <div id="mBody"></div>
  </div>
</div>

<script>
/* ===== 数据：以"大模块"为键，值为子模块数组 ===== */
const MODULES = {
  "剧情对话": {
    desc:"进入章节/关卡、任务、NPC、战斗、游历等场景触发的对白系统",
    subs:[
      { id:11, name:"章节/关卡剧情对白（线性剧情）", type:"剧情对白", status:"active", statusText:"生效 · Cocos",
        xlsx:"<span class='path'>concept\\data\\excel\\xml配置表\\新表\\mission_dialog.xlsx</span><br><span class='path dim'>→ 导出 mission_dialog_dat.lua（35句/10段）</span>",
        fe:"纯客户端播放，服务端不参与", be:"无（纯客户端线性剧情）",
        note:"10042 末句重复(order1/2/1)；order 不排序；自动播放 string.len/3/6 最小1秒；speed/delay/showskip/scale 未接入",
        desc:"进入章节、挑战关卡前播放的线性剧情，当前 Cocos 生效。",
        feFiles:"View/Common/NPCChatDialogUI.lua  （对白播放器）\nView/FuBenMap/NormalFuBenUI.lua  （章节入口 :1001-1005，:618 重置已播标记）\nView/FuBenMap/FuBenDetailUI.lua  （关卡入口）\nConfigData/bigmap_dat.lua  （章节 DialogueId 触发）\nConfigData/maplist_dat.lua  （关卡 DialogueId 触发）\nConfigData/npc_template_dat.lua  （NPC 名称/立绘）\nData/LUserConfigMgr.lua  （ChpaterDialogOver/StageDialogOver 设备级布尔）",
        beFiles:"（无服务端引用；剧情为客户端本地播放）",
        notes:"· 播放器按 mission_dialog_dat.lua 物理行序播放，不按 order 排序。\n· 已播状态为单设备两个布尔，覆盖全部章节/关卡，仅“新章节解锁”时重置（NormalFuBenUI:618）。\n· 10042 重复已存在于源表 mission_dialog.xlsx，须改源表后重跑 xl转表.exe。\n· 自动播放计时：NPCChatDialogUI:505 string.len(字节) /3/6，最小1秒；UTF-8字节与颜色标签致偏差。"
      },
      { id:12, name:"服务端任务剧情（任务对白）", type:"剧情对白", status:"dormant", statusText:"休眠 · 入口关闭",
        xlsx:"<span class='path dim'>无 Excel 源表</span><br><span class='path'>server/config/xml/mission_dialog.xml</span><br><span class='path dim'>mission_config.xml（340任务）· mission_dialog.json（662句/227组，非权威）</span>",
        fe:"PlotChatUI.lua（客户端播放器，当前无数据下发）", be:"mission_manager.cpp（Read* 三调用在 :1835-1837 被注释）",
        note:"入口已注释关闭；XML 与 JSON 字段差异；3处(dialogid,order)重复、9个非连续组、5个 accept_dialog 填正文被解析为0",
        desc:"任务接受/进行/完成时由服务端下发的对白，代码与数据保留但运行入口关闭。",
        feFiles:"View/Common/PlotChatUI.lua  （客户端任务剧情播放器）",
        beFiles:"server/src/mission_manager.cpp  （CMissionManager::Init；:1835-1837 注释 ReadMissionConfig/ReadMissionDialogConfig/ReadMubiaoConfig）\nserver/src/script_call.cpp  （剧情协议下发）\nserver/config/xml/mission_dialog.xml  （662句/227组，权威源）\nserver/config/xml/mission_config.xml  （340任务定义）\nserver/config/json/mission_dialog.json  （同结构 JSON，非权威运行源）",
        notes:"· 原状态机可串联：对白/战斗/道具提交/收集/接交任务/<name>/<sex> 替换。\n· 真实参与字段主要 order/npcid/dialog；position/scale/speed/delay/showskip 解析但未完整下发。\n· mission_config.xml 155 个数字型剧情引用均能找到对应剧情组。"
      },
      { id:13, name:"NPC 脚本对白与选项", type:"交互对白", status:"active", statusText:"生效",
        xlsx:"<span class='path dim'>无 Excel 源表（脚本内定义）</span><br><span class='path'>server/script/*.lua</span>",
        fe:"NPCChatUI.lua + LuaNetRecvdMsg.lua", be:"pack_deal.cpp + script_call.cpp + server/script/*.lua",
        note:"最多20选项对(建议≤3~4)；多数选项约5秒自动选第一项；重要分支(不可逆奖励/阵营/生死)不适用；缺统一可视化配置",
        desc:"玩家点击 NPC 后由服务端脚本下发 Dialog / Option 文本与分支回调。",
        feFiles:"View/Common/NPCChatUI.lua  （选项/对白显示）\nData/LuaNetRecvdMsg.lua  （/13 MSG_NPC_CHAT 接收）",
        beFiles:"server/src/pack_deal.cpp  （协议处理）\nserver/src/script_call.cpp  （脚本调用/回调）\nserver/script/*.lua  （如 NpcMain/SelectOption：Option/Dialog 函数）",
        notes:"· 分支全部写在 Lua 脚本中，缺统一可视化配置与静态校验。\n· 选项界面约5秒后自动选第一项，不适合不可逆剧情分支。\n· 选择经 /13 MSG_NPC_CHAT 回传服务端校验并执行回调。"
      },
      { id:14, name:"战斗对白", type:"战斗演出", status:"nosrc", statusText:"生效 · 无源表",
        xlsx:"<span class='path'>server/config/xml/fight_dialog.xml</span><br><span class='path dim'>（46行/17组；无 Excel 源表）</span>",
        fe:"BattleUnitNode.lua（单位头顶气泡）", be:"fight.cpp（触发）+ fight_config.xml / fight_special_config.xml（关联）",
        note:"仅按回合显示气泡；dialogid=1001 缺 show_turn/group 不触发；1006/1009/1010 未被战斗引用；不支持选项/镜头/立绘",
        desc:"指定回合在战斗单位头顶显示气泡文字，服务端触发、客户端显示。",
        feFiles:"View/Battle/BattleUnitNode.lua  （头顶气泡显示）",
        beFiles:"server/src/fight.cpp  （触发逻辑）\nserver/config/xml/fight_dialog.xml  （对白配置，46行/17组）\nserver/config/xml/fight_config.xml  （普通战斗关联）\nserver/config/xml/fight_special_config.xml  （特殊战斗关联）",
        notes:"· 字段：dialogid/show_turn/order/group/zhenfa_idx/time/dialog。\n· 43 行具备运行所需字段；1001 的3行缺 show_turn/group 不会触发。\n· 未被战斗配置引用的组：1001/1006/1009/1010。\n· 不支持选项、镜头、立绘与剧情状态分支。"
      },
      { id:15, name:"三界游历文本", type:"游历描述", status:"active", statusText:"生效",
        xlsx:"<span class='path'>concept\\data\\excel\\xml配置表\\新表\\sanjie_dialogue.xlsx</span><br><span class='path dim'>→ 导出 sanjie_dialogue.json（8条）</span>",
        fe:"YouLiUI.lua + ConfigData/sanjie_dialogue_dat.lua", be:"xun_bao_manage.cpp + server/config/json/sanjie_dialogue.json",
        note:"按事件类型 101/102 选择；游历氛围描述，非主线全屏剧情；8条(101×5, 102×3)",
        desc:"游历随机事件与结果描述文本，服务端数据、客户端显示。",
        feFiles:"View/YouLi/YouLiUI.lua  （游历界面显示）\nConfigData/sanjie_dialogue_dat.lua  （客户端配置）",
        beFiles:"server/src/xun_bao_manage.cpp  （游历逻辑）\nserver/config/json/sanjie_dialogue.json  （服务端数据，8条）",
        notes:"· 字段：id/type/des；%e 由巡游神将名替代，%d 为获得奖励。\n· 由 concept 下 sanjie_dialogue.xlsx 经 xl转表.exe 导出。\n· 属氛围描述，不进入主线全屏剧情系统。"
      }
    ]
  }
};

/* 大模块清单：除剧情对话外，其余为待梳理占位（按你列出的活跃模块 + 常见系统） */
const MODULE_ORDER = ["剧情对话","法宝","商店","邮件","副本","神将","抽卡","洞府","时装","背包","战斗","任务"];
const TODO_DESC = {
  "法宝":"fabao / fabao_qianghua / fabao_jinglian / fabao_looting 等 xlsx 已存在，待按 xlsx→代码 梳理子模块",
  "商店":"shop / shop_config xlsx 已存在，待梳理",
  "邮件":"mail 相关配置，待梳理财物/系统邮件子模块",
  "副本":"关卡/副本配置，待梳理",
  "神将":"hero xlsx 已存在，待梳理神将获取/养成子模块",
  "抽卡":"draw_basic / draw_config xlsx 已存在，待梳理",
  "洞府":"洞府生产（kunlun 等），待梳理",
  "时装":"时装配置，待梳理",
  "背包":"item / 临时背包，待梳理",
  "战斗":"战斗配置（fight_config 等），待梳理战斗对白外的战斗系统",
  "任务":"mission_config / mission_dialog，含已休眠的服务端任务剧情"
};

let curModule = "剧情对话";
let curFilter = "all";
const searchEl = document.getElementById('search');

const nav = document.getElementById('nav');
const mTitle = document.getElementById('mTitle');
const mSub = document.getElementById('mSub');
const mBody = document.getElementById('mBody');

function badge(s){
  if(s==='active') return '<span class="badge b-active">生效</span>';
  if(s==='dormant') return '<span class="badge b-dormant">休眠</span>';
  if(s==='nosrc') return '<span class="badge b-nosrc">无源表</span>';
  return '<span class="badge b-none">—</span>';
}

function buildNav(){
  nav.innerHTML='';
  MODULE_ORDER.forEach(name=>{
    const has = MODULES[name] && MODULES[name].subs.length;
    const div=document.createElement('div');
    div.className='nav-item'+(name===curModule?' active':'');
    let cnt;
    if(has) cnt='<span class="cnt">'+MODULES[name].subs.length+'</span>';
    else cnt='<span class="cnt todo">待梳理</span>';
    div.innerHTML='<span>'+name+'</span>'+cnt;
    div.addEventListener('click',()=>{ curModule=name; curFilter='all'; searchEl.value=''; buildNav(); render(); });
    nav.appendChild(div);
  });
}

function render(){
  const mod = MODULES[curModule];
  if(!mod){
    mTitle.textContent = curModule;
    mSub.textContent = '待梳理';
    mBody.innerHTML = '<div class="todo-box"><b>「'+curModule+'」大模块待梳理</b><br><br>'+
      (TODO_DESC[curModule]||'')+'<br><br>将按“concept 下 xlsx 为纲 → 搜 client/ProjectX/src 定前端、server/src+server/config 定后端”填充子模块。</div>';
    return;
  }
  mTitle.textContent = curModule;
  mSub.textContent = mod.desc||'';
  const q=searchEl.value.trim().toLowerCase();
  const rows = mod.subs.filter(d=>{
    if(curFilter!=='all' && d.status!==curFilter) return false;
    if(q){ const hay=(d.name+d.xlsx+d.fe+d.be+d.note+d.feFiles+d.beFiles+d.notes).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  let html = '<div class="controls"><input id="search" placeholder="搜索子模块 / 配置表 / 文件 / 状态…">'
    +'<div class="chips" id="chips"><span class="chip active" data-f="all">全部</span>'
    +'<span class="chip" data-f="active">生效</span><span class="chip" data-f="dormant">休眠</span>'
    +'<span class="chip" data-f="nosrc">无源表</span></div>'
    +'<span class="count" id="count"></span></div>';
  html += '<table><thead><tr><th style="width:21%">子模块</th><th style="width:22%">配置表（策划源 / 导出产物）</th>'
    +'<th style="width:14%">前端引用</th><th style="width:14%">后端引用</th><th style="width:9%">状态</th>'
    +'<th style="width:20%">备注</th></tr></thead><tbody id="tbody"></tbody></table>';
  html += '<div class="footer"><div><b>数据口径</b></div>'
    +'<div>· 配置表（策划侧）以 <code>E:\\neiwang_kapai\\concept\\data\\excel\\xml配置表\\新表\\</code> 下 Excel 源表为准，经 <code>concept\\data\\excel\\转表工具\\xl转表.exe</code> 导出。</div>'
    +'<div>· “导出产物 / 前端 / 后端引用文件” 由代码静态审计得出；“无” 表示该侧不引用。</div>'
    +'<div>· “无源表” = 该配置只有手写 XML/脚本，未进入 concept 转表链。</div>'
    +'<div>· 点击任意一行展开明细（触发文件、播放/协议路径、已知缺陷）。</div></div>';
  mBody.innerHTML = html;

  const tbody=document.getElementById('tbody');
  document.getElementById('count').textContent='显示 '+rows.length+' / '+mod.subs.length+' 个子模块';
  rows.forEach(d=>{
    const tr=document.createElement('tr'); tr.className='row';
    tr.innerHTML=`<td class="name">${d.name}<div style="color:var(--sub);font-weight:400;font-size:12px;margin-top:2px;">${d.type}</div></td>`
      +`<td>${d.xlsx}</td><td>${d.fe}</td><td>${d.be}</td>`
      +`<td>${badge(d.status)}<div style="color:var(--sub);font-size:11px;margin-top:2px;">${d.statusText}</div></td>`
      +`<td style="font-size:12.5px;color:var(--sub);">${d.note}</td>`;
    const dt=document.createElement('tr'); dt.className='detail'; dt.style.display='none';
    dt.innerHTML=`<td colspan="6"><div class="inner"><h4>说明</h4><div style="margin-bottom:12px;">${d.desc}</div>`
      +`<h4>前端引用文件</h4><div class="files">${d.feFiles}</div>`
      +`<h4>后端引用文件 / 协议</h4><div class="files">${d.beFiles}</div>`
      +`<h4>已知缺陷 / 审计备注</h4><div class="note">${d.notes}</div></div></td>`;
    tr.addEventListener('click',()=>{ dt.style.display = dt.style.display==='none'?'table-row':'none'; });
    tbody.appendChild(tr); tbody.appendChild(dt);
  });

  // 绑定搜索/筛选（重建后）
  const s=document.getElementById('search');
  s.addEventListener('input',()=>{ curFilter=document.querySelector('#chips .chip.active').dataset.f; render(); });
  document.getElementById('chips').addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); curFilter=c.dataset.f; render();
  });
}

buildNav();
render();
// 顶部搜索仅在已渲染输入框存在时生效：统一改用 body 内重建的搜索框
</script>
</body>
</html>
