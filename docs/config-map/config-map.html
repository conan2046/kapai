<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>功能模块配置表映射 · Steam 单机版规划</title>
<style>
  :root{ --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2329; --sub:#5b6168; --line:#e4e7ec; --line2:#eef0f4;
    --blue:#3445db; --green:#1f9d55; --gray:#8a9099; --red:#d4392b; --amber:#d98300; --chip:#eef0f4;
    --mono:Consolas,"Cascadia Mono",Menlo,"Courier New",monospace; --r:10px; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    height:100%;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.6;}
  header{padding:16px 26px 13px;background:var(--panel);border-bottom:1px solid var(--line);}
  h1{margin:0 0 3px;font-size:18px;font-weight:700;letter-spacing:.01em;}
  .meta{color:var(--sub);font-size:12px;}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .layout{display:flex;align-items:stretch;flex:1;min-height:0;overflow:hidden;}
  .sidebar{width:266px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px 24px;overflow:auto;}
  .nav-cat{display:flex;align-items:center;gap:7px;font-size:14px;color:#2b2f36;padding:11px 10px 6px;
    font-weight:700;cursor:pointer;user-select:none;border-radius:6px;letter-spacing:0;}
  .nav-cat:hover{background:#f4f6fb;color:var(--blue);}
  .nav-cat .chev{flex:0 0 10px;text-align:center;font-size:10px;color:#9aa1ab;transition:transform .15s;}
  .nav-cat.collapsed .chev{transform:rotate(-90deg);}
  .nav-cat .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-cat .ccnt{flex-shrink:0;font-size:10.5px;color:#a8aeb8;font-weight:600;}
  .nav-cat.has-cur{color:var(--blue);}
  .nav-cat.has-cur .cname::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--blue);margin-left:5px;vertical-align:1px;}
  .nav-items{border-left:2px solid var(--line2);margin-left:14px;padding-left:4px;}
  /* 三层：分类(nav-cat) → 模块(nav-mod) → 子模块(nav-sub) */
  .nav-mod{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:8px;
    cursor:pointer;color:var(--ink);font-size:12.5px;font-weight:600;margin-bottom:1px;user-select:none;}
  .nav-mod:hover{background:#f0f3ff;}
  .nav-mod.active{color:var(--blue);}
  .nav-mod .chev{flex:0 0 10px;text-align:center;font-size:9px;color:#9aa1ab;transition:transform .15s;}
  .nav-mod.collapsed .chev{transform:rotate(-90deg);}
  .nav-mod .mname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-mod .mcnt{font-size:10px;color:#a8aeb8;flex-shrink:0;}
  .nav-subs{margin:1px 0 5px 13px;border-left:1px dashed var(--line2);padding-left:5px;}
  .nav-sub{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;
    cursor:pointer;color:var(--sub);font-size:11.8px;margin-bottom:1px;user-select:none;}
  .nav-sub:hover{background:#f0f3ff;color:var(--ink);}
  .nav-sub.active{background:var(--blue);color:#fff;font-weight:600;}
  .nav-sub .sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-sub .sdot{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--green);}
  .nav-sub.active .sdot{background:rgba(255,255,255,.85);}
  .nav-search{padding:7px 10px;border:1px solid var(--line);border-radius:8px;width:100%;font-size:12px;
    outline:none;background:#fff;margin-bottom:8px;box-sizing:border-box;}
  .nav-search:focus{border-color:var(--blue);}
  .mig{font-size:9.5px;padding:1px 5px;border-radius:4px;flex-shrink:0;}
  .mig.ok{background:#e6f6ed;color:var(--green);} .mig.run{background:#e8edff;color:var(--blue);}
  .mig.ex{background:#fff3e0;color:var(--amber);} .mig.no{background:#eef0f4;color:var(--gray);}
  .nav-mod.active .mig.ok,.nav-mod.active .mig.run,.nav-mod.active .mig.ex,.nav-mod.active .mig.no{background:rgba(232,237,255,.9);color:var(--blue);}
  /* 子模块页：面包屑 */
  .crumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:12px;color:var(--sub);}
  .crumb .csep{color:#c2c8d0;}
  .crumb .lnk{cursor:pointer;color:var(--blue);}
  .crumb .lnk:hover{text-decoration:underline;}
  /* 模块总览卡片（点模块名进入） */
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px;margin-top:4px;}
  .ovcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:11px 13px;cursor:pointer;}
  .ovcard:hover{border-color:var(--blue);background:#f7f9ff;}
  .ovcard .on{font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .ovcard .od{color:var(--sub);font-size:11.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .main{flex:1;min-width:0;padding:18px 26px 48px;overflow:auto;}
  .main h2{margin:0 0 3px;font-size:17px;font-weight:700;}
  .main .sub{color:var(--sub);font-size:12.5px;margin-bottom:0;line-height:1.6;}
  .migtag{display:block;width:fit-content;font-size:11px;padding:2px 9px;border-radius:999px;margin:8px 0 14px;font-weight:600;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
  #search{padding:7px 12px;border:1px solid var(--line);border-radius:8px;min-width:290px;font-size:12.5px;outline:none;background:#fff;}
  #search:focus{border-color:var(--blue);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--chip);color:var(--sub);
    cursor:pointer;font-size:12px;user-select:none;}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .count{color:var(--sub);font-size:12px;margin-left:auto;}

  /* ===== 主表 ===== */
  .mtbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);table-layout:fixed;}
  .mtbl th{background:#f8f9fb;font-size:11.5px;color:#3a4048;font-weight:700;padding:9px 12px;text-align:left;
    border-bottom:1px solid var(--line);line-height:1.35;vertical-align:bottom;}
  .mtbl th .u{display:block;font-weight:400;font-size:10px;color:var(--gray);letter-spacing:.02em;}
  .mtbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:12.5px;line-height:1.6;overflow-wrap:anywhere;}
  .mtbl tbody tr.row{cursor:pointer;}
  .mtbl tbody tr.row:hover{background:#f6f8ff;}
  .mtbl tbody tr.row.open{background:#eef2ff;box-shadow:inset 3px 0 0 var(--blue);}
  .mtbl tbody tr.row.open>td, .mtbl tbody tr.detail>td{border-bottom-color:transparent;}
  .name{font-weight:600;color:var(--ink);}
  .name .nm{display:block;}
  .nmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px;}
  .nmeta .typ{color:var(--gray);font-weight:400;font-size:10.5px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
  .b-active{background:#e6f6ed;color:var(--green);} .b-dormant{background:#fdecea;color:var(--red);}
  .b-nosrc{background:#fff3e0;color:var(--amber);} .b-none{background:#eef0f4;color:var(--gray);}
  .vtag{display:inline-block;font-size:9.5px;font-weight:600;color:#1f9d55;background:#e6f6ed;border:1px solid #b6e3c8;
    border-radius:4px;padding:0 5px;white-space:nowrap;}
  /* 配置表依赖：chip 流式排列（一行一表会撑高行） */
  .tcell{display:flex;flex-wrap:wrap;gap:4px;}
  .tchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;
    background:#f7f9fc;border:1px solid var(--line);border-radius:5px;padding:1px 6px 1px 7px;line-height:1.65;}
  .tchip .tn2{color:#1f2329;font-weight:700;}
  .rc{font-size:9px;padding:0 4px;border-radius:3px;letter-spacing:.02em;font-family:-apple-system,"Microsoft YaHei",sans-serif;}
  .rc-main{background:#e8edff;color:var(--blue);} .rc-attr{background:#f0eaff;color:#7a5af8;}
  .rc-cost{background:#fff3e0;color:var(--amber);} .rc-suit{background:#e8eaff;color:#4f46e5;}
  .rc-sub{background:#e0f5f2;color:#0d9488;}
  .rc-form{background:#e6f6ed;color:var(--green);} .rc-unlock{background:#fdecea;color:var(--red);}
  .rc-drop{background:#fdeaf4;color:#db2777;} .rc-other{background:#eef0f4;color:var(--sub);}
  .rc-dep{background:#f3f4f6;color:#8a9099;text-decoration:line-through;}
  .rc-hold{background:#fdf6e3;color:#a16207;border:1px dashed #e0c88a;}
  .tline{display:flex;align-items:baseline;gap:5px;font-size:11.5px;line-height:1.5;margin-bottom:2px;}
  .tline:last-child{margin-bottom:0;}
  .tname{font-family:var(--mono);color:#1f2329;font-weight:600;overflow-wrap:anywhere;}
  .trole{font-size:9.5px;color:#5b6168;background:#eef0f4;border-radius:3px;padding:0 4px;flex-shrink:0;}

  /* ===== 键值双行（前端 C#/Lua、后端 server/SQLite） ===== */
  .krow{display:flex;gap:7px;align-items:flex-start;margin-bottom:5px;}
  .krow:last-child{margin-bottom:0;}
  .ktag{flex:0 0 50px;font-family:var(--mono);font-size:9.5px;font-weight:700;text-align:center;line-height:1.6;
    border-radius:4px;padding:1px 0;letter-spacing:.01em;}
  .k-cs{background:#e8edff;color:var(--blue);} .k-lua{background:#e6f6ed;color:var(--green);}
  .k-sv{background:#eef0f4;color:#4a5058;} .k-sq{background:#fff3e0;color:var(--amber);}
  .kval{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:#2b2f36;line-height:1.6;overflow-wrap:anywhere;}
  .kval em{font-style:normal;color:var(--gray);}
  .kval b{color:#1f2329;}

  /* ===== 明细面板 ===== */
  .mtbl tbody tr.detail>td{background:#fafbfd;padding:0;}
  .dwrap{padding:15px 18px 18px;border-bottom:2px solid var(--line);}
  .dtop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;}
  .sec.wide{grid-column:1/-1;}
  .sec>h4{margin:0 0 9px;font-size:12px;font-weight:700;color:#3a4048;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .sec>h4::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--blue);flex-shrink:0;}
  .sec>h4 .tag{font-weight:400;font-size:10px;color:var(--gray);background:#f2f4f8;border-radius:4px;padding:1px 6px;}
  .aud{background:#fffdf6;border-color:#efe0b4;}
  .aud>h4::before{background:var(--amber);}
  .desc{margin:0;font-size:12px;color:#2b2f36;line-height:1.75;}
  .fgrp{margin-bottom:10px;} .fgrp:last-child{margin-bottom:0;}
  .fgh{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px;
    padding-bottom:3px;border-bottom:1px dashed var(--line);}
  .fgh .n{color:var(--gray);font-weight:400;}
  .fitem{font-family:var(--mono);font-size:10.5px;color:#2b2f36;line-height:1.65;padding:1px 0 1px 11px;
    position:relative;overflow-wrap:anywhere;}
  .fitem::before{content:"›";position:absolute;left:2px;color:#b9bfc8;}
  .fitem.note{font-family:inherit;font-size:11.5px;color:var(--gray);}
  ul.bul{margin:0;padding-left:0;list-style:none;}
  ul.bul li{position:relative;font-size:11.5px;line-height:1.75;color:#3a4048;padding-left:14px;margin-bottom:7px;overflow-wrap:anywhere;}
  ul.bul li:last-child{margin-bottom:0;}
  ul.bul li::before{content:"";position:absolute;left:3px;top:8px;width:4px;height:4px;border-radius:50%;background:#c2c8d0;}
  /* 深度审计栏目 */
  .kv2{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;table-layout:fixed;}
  .kv2 td{padding:5px 9px;border-bottom:1px solid var(--line2);vertical-align:top;overflow-wrap:anywhere;}
  .kv2 tr:last-child td{border-bottom:none;}
  .kv2 td.k{width:24%;color:var(--sub);font-weight:700;}
  .kv2 td.v{color:#2b2f36;}
  .mono{margin:0;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#2b2f36;background:#f7f9fc;
    border:1px solid var(--line2);border-radius:6px;padding:9px 11px;white-space:pre-wrap;overflow-wrap:anywhere;}
  .sec>h4 .tag{font-weight:400;font-size:10px;color:var(--gray);background:#f2f4f8;border-radius:4px;padding:1px 6px;}
  .mtag{display:inline-block;font-family:var(--mono);font-size:9.5px;background:#eef2ff;color:var(--blue);
    border-radius:4px;padding:0 5px;margin-right:5px;}
  .subtbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .subtbl th{background:#f2f4f8;font-size:10.5px;color:var(--sub);font-weight:700;padding:6px 8px;text-align:left;
    border-bottom:1px solid var(--line);}
  .subtbl td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top;overflow-wrap:anywhere;line-height:1.55;}
  .subtbl tr:last-child td{border-bottom:none;}
  .subtbl .tn{font-family:var(--mono);font-weight:700;color:#1f2329;}
  .subtbl .px{font-family:var(--mono);font-size:10px;color:var(--blue);}
  .subtbl .px.role{color:#5b6168;}
  .subtbl .px.txt{font-family:inherit;font-size:11px;color:#3a4048;line-height:1.6;}
  .path{font-family:var(--mono);font-size:10.5px;color:var(--blue);overflow-wrap:anywhere;}
  .path.dim{color:var(--gray);}
  .todo-box{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--sub);}
  /* 总览首页入口 */
  .nav-home{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;cursor:pointer;
    font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:8px;border:1px solid var(--line);
    background:#f7f9ff;user-select:none;}
  .nav-home:hover{border-color:var(--blue);}
  .nav-home.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .nav-home .hico{flex-shrink:0;font-size:13px;}
  .nav-home.plan{background:#fff8ed;border-color:#f0d6ad;color:#8a5200;}
  .nav-home.plan:hover{border-color:var(--amber);}
  .nav-home.plan.active{background:var(--amber);border-color:var(--amber);color:#fff;}
  /* 总览页统计卡 */
  .statrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
  .statcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:11px 13px;}
  .statcard .sv{font-size:21px;font-weight:700;color:var(--ink);line-height:1.2;}
  .statcard .sl{font-size:11px;color:var(--sub);margin-top:2px;}
  /* 页脚：与上方栏目同款 .sec 卡片；h4 复用 .sec>h4 蓝条样式 */
  .fsec{font-size:11.5px;color:var(--sub);line-height:1.75;}
  .fsec b{color:var(--ink);}
  .fsec code{background:#eef0f4;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:10.5px;color:#3a4048;}
  #mBody>.sec{margin-bottom:12px;}
  /* 常驻图例速查 */
  .legend{display:grid;grid-template-columns:112px minmax(0,1fr);gap:6px 14px;padding:11px 13px;
    background:#fafbfd;border:1px solid var(--line2);border-radius:8px;margin-bottom:10px;}
  .legend .lk{font-weight:700;color:#4a5058;font-size:11px;line-height:1.7;}
  .legend .lv{color:#3a4048;font-size:11.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;}
  .legend .lv .tchip{font-size:10.5px;}
  .fsec ul.fl{margin:2px 0 0;padding:0;list-style:none;}
  .fsec ul.fl li{position:relative;padding-left:12px;margin-bottom:7px;color:#3a4048;overflow-wrap:anywhere;}
  .fsec ul.fl li:last-child{margin-bottom:0;}
  .fsec ul.fl li::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:50%;background:#c2c8d0;}
  .fsec ul.fl li.em::before{background:var(--amber);}
  /* Steam 单机版改造页 */
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px;}
  .plan-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .plan-card .pt{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:5px;}
  .plan-card .pd{font-size:11.5px;color:var(--sub);line-height:1.75;}
  .decision{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:700;white-space:nowrap;}
  .decision.keep{background:#e6f6ed;color:var(--green);}.decision.change{background:#e8edff;color:var(--blue);}
  .decision.stop{background:#fdecea;color:var(--red);}.decision.wait{background:#fff3e0;color:var(--amber);}
  .phase{font-family:var(--mono);font-size:10px;color:var(--blue);font-weight:700;}
  .doclink{color:var(--blue);font-weight:700;text-decoration:none;}.doclink:hover{text-decoration:underline;}
  @media (max-width:900px){ .legend{grid-template-columns:1fr;} }
  @media (max-width:1200px){ .dtop{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="app">
<header>
  <h1>功能模块 · 配置表 / Lua / XML 映射</h1>
  <div class="meta">范围：Unity 活跃模块 + Steam 单机版处理矩阵 + 剧情对话 · 状态源 UNITYCLIENT_STATUS.md · 数据 2026-09-13 · 单文件离线版</div>
</header>
<div class="layout">
  <nav class="sidebar"><input id="navSearch" class="nav-search" placeholder="搜索子模块名…"><div id="nav"></div></nav>
  <div class="main"><h2 id="mTitle"></h2><div class="sub" id="mSub"></div><div id="mBody"></div></div>
</div>

/* 路径断点：仅在 / \ . 及驼峰边界后允许换行，避免把标识符从中间硬折断 */
function wbr(s){
  return String(s)
    .replace(/([\/\\])/g,'$1<wbr>')
    .replace(/([a-z0-9])([A-Z])/g,'$1<wbr>$2')
    .replace(/\.(?=[a-z0-9]{1,6}(\b|<))/gi,'.<wbr>');
}
/* 把 "server：…<br>SQLite：…" 这类双行串渲染为带色标签的键值行。
   short=true 用于主表单元格：逗号清单只留前 4 项、超长截断，完整值放 title 悬浮。 */
const KTAG={'C#':'k-cs','Lua':'k-lua','server':'k-sv','SQLite':'k-sq'};
function kv(html, short){
  const segs=(html||'').split(/<br\s*\/?>/i);
  return segs.map(s=>{
    const m=s.match(/^\s*<b[^>]*>([\s\S]*?)<\/b>\s*[：:]\s*([\s\S]*)$/);
    if(!m) return '<div class="krow"><span class="kval">'+(short?wbr(s):s)+'</span></div>';
    const cls=KTAG[m[1]]||'k-sv';
    let raw=m[2], val=wbr(raw);
    let tip='';
    if(short){
      const parts=raw.split(/,\s*/);
      if(parts.length>4) val=wbr(parts.slice(0,4).join(', ')+' …+'+(parts.length-4));
      tip=' title="'+String(raw).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;')+'"';
    }
    return '<div class="krow"'+tip+'><span class="ktag '+cls+'">'+m[1]+'</span><span class="kval">'+val+'</span></div>';
  }).join('');
}
/* 文件清单按侧别分组：前端=C#/Lua，后端=server源码/config；括号开头的说明行单独归入「说明」 */
function fgroups(txt,kind){
  const lines=(txt||'').split(/\n|<br\s*\/?>/i).map(x=>x.trim()).filter(Boolean);
  const defs = kind==='fe'
    ? [['C# · Unity',[]],['Lua · Cocos',[]],['说明 / 占位',[]]]
    : [['server 源码 · 协议',[]],['server 配置 json / xml',[]],['说明 / 占位',[]]];
  lines.forEach(l=>{
    let b;
    const isNote=/^[（(]/.test(l);
    if(isNote) b=2;
    else if(kind==='fe') b=/\.cs\b/.test(l)?0:(/\.lua\b/.test(l)?1:2);
    else b=/\.(cpp|h|hpp)\b/.test(l)?0:(/\/config\//.test(l)?1:2);
    defs[b][1].push(l);
  });
  const used=defs.filter(x=>x[1].length);
  if(!used.length) return '<div class="fitem note">（未记录引用文件）</div>';
  return used.map(([h,arr])=>
    '<div class="fgrp"><div class="fgh">'+h+' <span class="n">· '+arr.length+'</span></div>'
    +arr.map(x=>'<div class="fitem'+(/^[（(]/.test(x)?' note':'')+'">'+wbr(x)+'</div>').join('')
    +'</div>').join('');
}
/* 取双行串中的某一侧（如只看 SQLite） */
function kvTag(html,name,fallback){
  const one=(html||'').split(/<br\s*\/?>/i).filter(s=>{
    const m=s.match(/^\s*<b[^>]*>([\s\S]*?)<\/b>\s*[：:]/); return m && m[1]===name;
  });
  if(one.length) return kv(one.join(''));
  return '<div class="krow"><span class="ktag k-sq">'+name+'</span><span class="kval"><em>'+(fallback||'（未登记）')+'</em></span></div>';
}
/* 深度审计栏目渲染（对标 docs/COCOS_ANSWER_SYSTEM.md 的详细度）
   k: kv=键值表 / tbl=多列表格 / tree=等宽调用链 / ul=要点列表 */
function secBody(s){
  let body='';
  if(s.k==='kv'){
    body='<table class="kv2">'+s.v.map(r=>'<tr><td class="k">'+r[0]+'</td><td class="v">'+r[1]+'</td></tr>').join('')+'</table>';
  }else if(s.k==='tbl'){
    const head=s.v[0], rows=s.v.slice(1);
    body='<table class="subtbl"><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
      +rows.map(r=>'<tr>'+r.map((c,i)=>'<td class="'+(i===0?'tn':'px txt')+'">'+c+'</td>').join('')+'</tr>').join('')
      +'</tbody></table>';
  }else if(s.k==='tree'){
    body='<pre class="mono">'+String(s.v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre>';
  }else{
    body='<ul class="bul">'+s.v.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  }
  return body;
}
function secRender(list){
  if(!list || !list.length) return '';
  return list.map(s=>{
    const wide=(s.k==='tbl'||s.k==='tree')?' wide':'';
    const cls='sec'+wide+(s.cls?' '+s.cls:'');
    return '<section class="'+cls+'"><h4>'+s.h+(s.tag?'<span class="tag">'+s.tag+'</span>':'')+'</h4>'+secBody(s)+'</section>';
  }).join('');
}

      +'<li><b>一致性写入</b>：服务端先刷新当前角色数据，再通过 SQLite 快照写入目标档；临时替换目录仅用于失败回滚，成功后删除。</li>'
      +'<li><b>新游戏种子</b>：正式新档必须从干净 schema/seed 创建，不能沿用 <code>local_test</code> 的99级和大量货币测试角色。</li>'
      +'<li><b>Steam适配层</b>：当前保证离线可玩；Steam身份、成就与Cloud属于后续平台阶段。</li>'
      +'<li><b>游戏内系统菜单</b>：保存游戏打开同一存档页；空档创建历史时点，已有档覆盖，离开游戏直接关闭。</li>'
      +'<li><b>构建与验收</b>：覆盖首启、10档隔离、同角色多时间点、多角色多档、永久覆盖/删除、初始角色、功能解锁与红点。</li>'
    +'</ul></section>'
    +'<section class="sec wide fsec"><h4>目标存储结构<span class="tag">每个档位 = 独立历史时点</span></h4><pre class="mono">Application.persistentDataPath/\n  Saves/Slot01/projectx.db\n  Saves/Slot01/metadata.json\n  Saves/Slot02/...\n  ...\n  Saves/Slot10/...\n  Saves/Pending/（保存过程临时文件，成功后清理）</pre></section>'
    +'<section class="sec wide fsec"><h4>模块单机化处理矩阵<span class="tag">'+SINGLE_PLAYER_POLICY.length+' 个顶层模块</span></h4>'
      +'<table class="subtbl"><thead><tr><th style="width:12%">分类</th><th style="width:13%">模块</th><th style="width:10%">单机决策</th><th style="width:30%">处理边界</th><th style="width:7%">阶段</th><th style="width:28%">当前项目状态</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'</section>'
    +'<section class="sec wide fsec"><h4>实施顺序<span class="tag">先可启动、再可长期玩、最后接云</span></h4><ul class="fl">'
      +'<li><b>P0</b>：标题页、10档选择、正式新档、数据库路径注入、原子保存、设备设置与支付隐藏。</li>'
      +'<li><b>P1</b>：核心养成/世界/背包/任务/答题接入档位；补游戏内另存/覆盖、功能解锁与红点回归。</li>'
      +'<li><b>P2</b>：其余单人玩法、单机商城/抽卡/邮件规则、剧情已播状态与随机状态持久化。</li>'
      +'<li><b>P3</b>：Steam身份与Cloud冲突处理、成就；时装与被排除模块仅在重新立项后处理。</li>'
    +'</ul></section>';
}
function render(){
  const _main=mBody.parentElement;
  if(_main) _main.scrollTop = 0;
  if(curHome){ renderHome(); return; }
  if(curSinglePlayer){ renderSinglePlayer(); return; }
  const info = DATA[curCat] ? DATA[curCat][curModule] : null;
  if(!info){ mTitle.textContent=''; mSub.textContent=''; mBody.innerHTML='<div class="todo-box">未找到模块</div>'; return; }
  const subs = info.subs||[];
  mTitle.textContent = curModule;
  mSub.textContent = info.desc||'';
  const mt=document.createElement('span'); mt.className='migtag mig '+migClass(info.mig); mt.textContent='迁移状态：'+info.migText; mSub.appendChild(mt);
  const d = subs[curSub];
  if(!d){ mBody.innerHTML='<div class="todo-box">该模块暂无子模块数据 —— 回左侧「总览」查看全站规则</div>'; return; }
  const idx = curSub;
  const crumb = '<div class="crumb"><span class="lnk" id="cbCat">'+curCat+'</span><span class="csep">›</span>'
    +'<span class="lnk" id="cbMod">'+curModule+'</span><span class="csep">›</span>'
    +'<span style="color:var(--ink);font-weight:700;">'+d.name+'</span>'
    +(d.verified?'<span class="vtag">✔已核验</span>':'')
    +badge(d.status)
    +'<span style="color:var(--gray);">'+(d.statusText||'')+'</span>'
    +'<span style="margin-left:auto;color:var(--gray);">子模块 '+(idx+1)+' / '+subs.length+'</span></div>';
  const hasTbl = !!(d.tables && d.tables.length);
  /* 栏目排序：模块说明 → 入口 → 策划(配置表) → 协议 → 前端 → 链路 → 后端 → 验证 → 已知问题(合并置底) */
  const secs=(d.sections||[]);
  const isIssue=s=>/已知问题/.test(s.h||'');
  const issueSecs=secs.filter(isIssue);
  const rest=secs.filter(s=>!isIssue(s));
  const used={};
  const pick=re=>{ const arr=rest.filter(s=>!used[s.h]&&re.test(s.h||'')); arr.forEach(s=>used[s.h]=1); return secRender(arr); };
  const leftover=()=>secRender(rest.filter(s=>!used[s.h]));
  const issuesCard='<section class="sec wide aud"><h4>已知问题与缺陷 · 审计备注<span class="tag">本页最后核对区</span></h4>'
    +issueSecs.map(s=>secBody(s)).join('')
    +bullets(d.notes)+'</section>';
  mBody.innerHTML = crumb
    +'<section class="sec"><h4>模块说明</h4><p class="desc">'+(d.desc||'（无说明）')+'</p></section>'
    +pick(/标识|入口/)
    +(hasTbl ? tblDetail(d)
      : '<section class="sec wide"><h4>依赖配置表清单 · 完整性</h4>'
        +'<div class="fitem note">（本子模块尚未逐文件抽取依赖表清单，待按装备/法宝标准补全）</div></section>')
    +pick(/协议/)
    +'<section class="sec"><h4>前端引用文件<span class="tag">Unity C# + Cocos Lua</span></h4>'+fgroups(d.feFiles,'fe')+'</section>'
    +pick(/客户端代码|前端代码/)
    +pick(/调用链/)
    +'<section class="sec"><h4>后端落库<span class="tag">SQLite · projectx.db</span></h4>'
      +kvTag(d.be,'SQLite','（本模块未登记落库表）')+'</section>'
    +pick(/服务端代码|后端代码/)
    +pick(/状态|落库/)
    +'<section class="sec"><h4>后端引用文件<span class="tag">server 源码 / 配置 / 协议</span></h4>'+fgroups(d.beFiles,'be')+'</section>'
    +pick(/验证/)
    +leftover()
    +issuesCard;
  const cbCat=mBody.querySelector('#cbCat');
  if(cbCat) cbCat.addEventListener('click',()=>{ navQuery=''; const ns=document.getElementById('navSearch'); if(ns) ns.value=''; curHome=true; curSinglePlayer=false; buildNav(); render(); });
  const cbMod=mBody.querySelector('#cbMod');
  if(cbMod) cbMod.addEventListener('click',()=>{
    modCollapsed[curCat+'|'+curModule]=false;
    const mdiv=nav.querySelector('.nav-mod.active');
    if(mdiv){ mdiv.classList.remove('collapsed'); const sb=mdiv.nextElementSibling; if(sb && sb.classList.contains('nav-subs')) sb.style.display=''; }
  });
}
curModule='剧情对话'; curCat='剧情'; curSub=0;
buildNav(); render();
document.getElementById('navSearch').addEventListener('input',e=>{
  navQuery=e.target.value.trim().toLowerCase(); buildNav();
});
</script>
</body>
</html>
