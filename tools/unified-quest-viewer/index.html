in-height:420px}.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:15px;margin-bottom:14px}.section-title h2{font-size:17px;margin:0}.muted{color:#8490a3;font-size:12px}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.source{text-align:left;padding:16px;background:#fff;min-height:126px}.source:hover{border-color:#79a5e4}.source .row{display:flex;justify-content:space-between;gap:8px}.source strong{font-size:14px}.source b{font-size:20px}.source .path{color:#8793a7;font-size:11px;overflow-wrap:anywhere;margin-top:11px}.source .note{color:#64738a;font-size:12px;margin-top:7px}.status{border-radius:20px;padding:4px 8px;font-size:11px;background:#edf3ff;color:#4673ae;white-space:nowrap}.status.old{background:#f3eef9;color:#7a5c9b}.status.pending{background:#fff2e4;color:#a46b28}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}select,input{border:1px solid #d9e1ec;background:white;border-radius:8px;color:#253957;padding:9px 11px;outline:none}input{min-width:270px;flex:1}select{max-width:460px}.count{color:#7c889b;font-size:12px;margin-left:auto}.table-wrap{overflow:auto;border:1px solid #e2e7ee;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:#f8fafc;text-align:left;color:#61718a;font-weight:700;white-space:nowrap}th,td{padding:10px 11px;border-bottom:1px solid #e9edf3;max-width:390px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}tbody tr:hover{background:#f2f6fc}.pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-top:13px;font-size:12px;color:#718099}.pager button:disabled{opacity:.4;cursor:default}.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.detail{border:1px solid #dfe6f0;border-radius:10px;padding:14px;background:#fbfcfe;overflow:auto;max-height:650px}.detail h3{font-size:14px;margin:0 0 10px}.detail pre{font-family:Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.55;margin:0;color:#34506f}.detail .hint{color:#8b98a9;font-size:12px}.warning-list{padding-left:18px;color:#566881;font-size:13px;line-height:1.85}.check{display:flex;gap:12px;flex-wrap:wrap}.check div{background:#f5f8fd;border:1px solid #e5ebf3;padding:12px 15px;border-radius:9px;font-size:12px;color:#637188}.check b{display:block;color:#203a5d;font-size:19px;margin-top:4px}.foot{font-size:11px;color:#8490a0;margin-top:16px}.empty{padding:35px;color:#8290a3;text-align:center;font-size:13px}@media(max-width:950px){.metrics{grid-template-columns:repeat(2,1fr)}.sources{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.detail{max-height:300px}}@media(max-width:620px){.shell{padding:0 14px 35px}.hero{display:block}.hero h1{font-size:25px}.hero button{margin-top:18px}.metrics,.sources{grid-template-columns:1fr}}
.type-summary{margin:8px 0 16px}.type-summary h3{font-size:14px;margin:0 0 8px}.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;max-height:290px;overflow:auto}.type-card{background:#f8faff;border:1px solid #dfe8f4;border-radius:9px;padding:10px 12px;text-align:left;color:#27415f}.type-card:hover,.type-card.active{background:#e7f0ff;border-color:#75a4e8}.type-card strong{display:block;font-size:12px}.type-card small{display:block;color:#71839d;margin-top:4px;font-size:11px;line-height:1.4}.field-list{display:grid;grid-template-columns:100px minmax(0,1fr);gap:5px 9px;font-size:12px;line-height:1.55}.field-list dt{color:#718097}.field-list dd{margin:0;overflow-wrap:anywhere;color:#263d5a}.raw{margin-top:14px;border-top:1px solid #e3e9f1;padding-top:10px}.raw summary{cursor:pointer;font-size:11px;color:#7890ad}.raw pre{margin-top:8px}.field-help{margin:8px 0 14px;color:#75869c;font-size:12px;line-height:1.55}

<body><div class="shell"><header class="top"><div><div class="brand"><span>任务 /</span> 统一任务系统</div><div class="sub">旧配置与脚本迁移审计 · 本地只读预览</div></div><span class="badge">静态资料盘点</span></header><section class="hero"><div><div class="eyebrow">迁移依据预览</div><h1>把分散来源放到同一张审计视图</h1><p>逐条查看表格、服务端导出、剧情对白和 Lua 任务调用。这里展示原始记录与静态关联；统一任务模型、事件去重及运行时可达性仍需进一步核对。</p></div><button id="refresh">重新读取源文件</button></section><section id="metrics" class="metrics"></section><div id="notice" class="notice"></div><nav id="tabs" class="tabs"></nav><main id="content" class="panel">读取中…</main><div class="foot" id="foot"></div></div><script>
let data=null,tab=new URLSearchParams(location.search).get('tab')||'overview',selected=null,search='',page=0,group=null;
const tabs=[['overview','来源总览'],['events','事件候选'],['tasks','任务与条件'],['story','剧情对白'],['lua','Lua 脚本'],['related','其他事件表'],['checks','核对结果'],['editor','统一 Excel 编辑器 ↗']];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function src(name){return data.sources.find(x=>x.name===name)}
function setTab(t){tab=t;history.replaceState(null,'',t==='overview'?'/' : '?tab='+encodeURIComponent(t));selected=null;search='';page=0;group=null;render()}
function statusClass(x){return x==='历史休眠'?'old':x==='待归类'||x==='读取失败'?'pending':''}
function render(){if(!data)return; $('tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${id===tab?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>x.dataset.tab==='editor'?location.assign('/editor'):setTab(x.dataset.tab));const c=$('content');if(tab==='overview')overview(c);else if(tab==='events')events(c);else if(tab==='checks')checks(c);else if(tab==='lua')lua(c);else if(tab==='story')story(c);else if(tab==='related')records(c,['帮派任务','帮派活跃','闯关事件']);else records(c,['每日任务源表','每日条件字典','旧任务源表','每日任务服务端导出','旧任务服务端导出'])}
function overview(c){c.innerHTML=`<div class="section-title"><h2>已读取的配置来源</h2><span class="muted">点击来源查看全部原始字段</span></div><div class="sources">${data.sources.map(s=>`<button class="source" data-source="${esc(s.name)}"><div class="row"><strong>${esc(s.name)}</strong><span class="status ${statusClass(s.status)}">${esc(s.status)}</span></div><b>${s.count}</b><div class="note">${esc(s.note)}</div><div class="path">${esc(s.path)}</div></button>`).join('')}</div>`;document.querySelectorAll('[data-source]').forEach(el=>el.onclick=()=>{let name=el.dataset.source;setTab(['章节剧情源表','旧剧情源表','旧剧情服务端导出'].includes(name)?'story':['帮派任务','帮派活跃','闯关事件'].includes(name)?'related':'tasks');selected=name;render()})}
const fieldLabels={id:'配置编号',type:'类型编号',daily:'每日重置',level:'开放等级',show:'显示前置',des:'任务描述',condition:'完成条件',reward:'奖励配置',jump:'跳转入口',name:'名称',kind:'任务大类',subtype:'任务子类',doing_target:'完成目标配置',acceptable_desc:'接取说明',accept_script:'接取脚本',accept_auto:'自动接取',accept_npc:'接取NPC',premission_limit:'前置任务限制',profession_limit:'职业限制',sex_limit:'性别限制',min_level:'最低等级',max_level:'最高等级',day_finished_limit:'每日完成上限',weight:'权重',accept_dialog:'接取对话',accept_autorun:'接取自动寻路',comment:'备注',accept_todo:'接取动作',open_panel:'打开界面',doing_desc:'进行中说明',finish_reward:'完成奖励',finish_reward2:'完成奖励2',finish_auto:'自动完成',finish_todo:'完成动作',dialogid:'对话组编号',order:'组内顺序',npcid:'说话人NPC',position:'立绘位置',dialog:'对白内容',scale:'立绘缩放',speed:'文字速度',delay:'延迟时间',showskip:'显示跳过',value:'目标值',param:'参数',desc_str:'描述',award1:'奖励1',num1:'奖励1数量',award2:'奖励2',num2:'奖励2数量',desc:'说明',pic:'图片资源',level_reward:'关卡奖励',"rewardid-count-type":'奖励配置',"类型":'条件编号',"条件类型":'条件名称',"参数说明":'参数含义',"配置方式":'配置示例',_line:'源表行号',legacy_key:'旧事件编号',namespace:'旧系统',description:'事件含义',task_count:'引用任务数',cpp_call_count:'服务端调用数',lua_ref_count:'Lua引用数',review_state:'核对状态',file:'脚本文件',lines:'代码行数',task_ref_count:'任务相关行数',npc:'关联NPC',scope:'分析范围',path:'文件路径',cpp_sites:'服务端调用位置',lua_sites:'Lua引用位置',definition:'代码声明'};
function fieldName(k,source){if(k==='type'&&['每日任务源表','每日任务服务端导出'].includes(source))return '任务分类';if(k==='type'&&source==='帮派任务')return '帮派任务类型';if(k==='type'&&source==='闯关事件')return '闯关事件类型';if(k==='entry_summary')return '入口线索';if(k==='task_call_count')return '任务相关调用';return fieldLabels[k]||'原字段 '+k}
function dailyCondition(v){let parts=String(v??'').split(',').map(x=>x.trim()).filter(Boolean),entry=data.event_candidates.find(x=>x.legacy_key==='EMQCT_'+parts[0]),dict=src('每日条件字典').records.find(x=>String(x['类型'])===parts[0]);if(!entry)return String(v??'');let name=entry.description||'条件 '+parts[0],schema=String(dict?.['参数说明']||'').split(/[，,]/).map(x=>x.trim()).slice(1);if(parts.length===2&&schema[0]==='数量'&&name.includes('次数'))return name+' · 目标 '+parts[1]+' 次';return name+(parts.length>1?' · '+parts.slice(1).map((x,i)=>(schema[i]||'参数'+(i+1))+' '+x).join('／'):'')}
function shown(k,v,source){if(v===undefined||v===null)return '';if(k==='condition'&&['每日任务源表','每日任务服务端导出'].includes(source))return dailyCondition(Array.isArray(v)?v.join(','):v);if(k==='daily'&&['每日任务源表','每日任务服务端导出'].includes(source))return +v===1?'是':+v===0?'否':v;if(k==='type'&&['每日任务源表','每日任务服务端导出'].includes(source))return '分类 '+v;if(k==='doing_target'&&source==='旧任务源表'){let n=String(v).match(/^\d+/),e=n&&data.event_candidates.find(x=>x.legacy_key==='EMISS_DC_'+n[0]);return e?(e.description||'旧目标 '+n[0])+' · '+v:v}if(k==='legacy_key')return String(v).replace('EMQCT_','每日条件 ').replace('EMISS_DC_','旧任务目标 ');if(Array.isArray(v))return v.map(x=>typeof x==='object'?JSON.stringify(x):x).join('、');if(typeof v==='object')return JSON.stringify(v);return String(v)}
function detailHtml(row,source){let list=Object.entries(row).filter(([k])=>!['cpp_sites','lua_sites','definition','task_refs','npcs'].includes(k)).map(([k,v])=>`<dt>${esc(fieldName(k,source))}</dt><dd>${esc(shown(k,v,source))}</dd>`).join('');let evidence='';if(row.definition?.path)evidence+=`<p><b>代码声明</b><br>${esc(row.definition.path)}:${row.definition.line}<br>${esc(row.definition.comment)}</p>`;for(let [key,title] of [['cpp_sites','服务端直接调用'],['lua_sites','Lua 常量引用']])if(row[key]?.length)evidence+=`<p><b>${title}（${row[key].length}）</b></p>`+row[key].slice(0,40).map(x=>`<p style="font-size:11px;overflow-wrap:anywhere">${esc(x.path)}:${x.line}<br>${esc(x.text)}</p>`).join('');return `<h3>配置详情</h3><dl class="field-list">${list}</dl>${evidence}<details class="raw"><summary>展开原始字段与编号</summary><pre>${esc(JSON.stringify(row,null,2))}</pre></details>`}
function tableRows(rows,cols,source){let start=page*50,slice=rows.slice(start,start+50);return `<div class="table-wrap"><table><thead><tr>${cols.map(k=>`<th>${esc(fieldName(k,source))}</th>`).join('')}</tr></thead><tbody>${slice.map((r,i)=>`<tr data-row="${start+i}">${cols.map(k=>`<td title="${esc(shown(k,r[k],source))}">${esc(shown(k,r[k],source))}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">没有匹配记录</div>'}</div><div class="pager"><span>第 ${rows.length?page+1:0} / ${Math.ceil(rows.length/50)} 页 · 显示 ${rows.length?start+1:0}–${Math.min(start+50,rows.length)} 条，共 ${rows.length} 条</span><button id="prev" ${page===0?'disabled':''}>上一页</button><button id="next" ${(page+1)*50>=rows.length?'disabled':''}>下一页</button></div>`}
function bindTable(rows,detail,source){document.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>{$('detail').innerHTML=detailHtml(rows[+el.dataset.row],source)});$('prev').onclick=()=>{page--;detail()};$('next').onclick=()=>{page++;detail()}}
function events(c){if(!['EMQCT','EMISS_DC'].includes(selected))selected='EMQCT';let rows=data.event_candidates.filter(r=>r.namespace===selected&&(!search||JSON.stringify(r).toLowerCase().includes(search.toLowerCase())));let show=()=>{c.innerHTML=`<div class="section-title"><h2>事件类型候选 · ${selected==='EMQCT'?'每日条件':'旧任务目标'}</h2><span class="muted">按编号空间分别审计，不自动合并</span></div><div class="notice"><strong>待人工核对：</strong>同号并不代表同一事件。例如每日条件 9 是竞技场挑战，旧任务目标 9 是神将招募。直接调用命中只证明源码存在，不证明运行时可达。</div><div class="toolbar"><select id="namespace"><option value="EMQCT" ${selected==='EMQCT'?'selected':''}>每日条件</option><option value="EMISS_DC" ${selected==='EMISS_DC'?'selected':''}>旧任务目标</option></select><input id="search" placeholder="搜索编号、含义、源码调用…" value="${esc(search)}"><span class="count">${rows.length} 个候选</span></div><div class="split"><div>${tableRows(rows,['legacy_key','description','task_count','cpp_call_count','lua_ref_count','review_state'],'事件候选')}</div><aside id="detail" class="detail"><h3>事件证据</h3><div class="hint">点击候选查看声明位置、服务端直接调用和 Lua 常量引用。任务数来自表格，尚未做跨系统语义去重。</div></aside></div>`;$('namespace').onchange=e=>{selected=e.target.value;page=0;events(c)};$('search').oninput=e=>{search=e.target.value;page=0;events(c);$('search').focus();$('search').setSelectionRange(search.length,search.length)};bindTable(rows,show,'事件候选')};show()}
function typeOf(row,source){if(source==='每日任务源表'){let m=String(row.condition??'').match(/^\s*(\d+)/);return m?.[1]||'未配置'}if(source==='旧任务源表'){let m=String(row.doing_target??'').match(/^\s*(\d+)/);return m?.[1]||'未配置'}if(['帮派任务','闯关事件'].includes(source))return String(row.type??'未配置');return null}
function typeCards(s){if(!['每日任务源表','旧任务源表','帮派任务','闯关事件'].includes(s.name))return '';let counts=new Map();for(let r of s.records){let k=typeOf(r,s.name);counts.set(k,(counts.get(k)||0)+1)}let title=s.name==='每日任务源表'?'按完成条件类型汇总':s.name==='旧任务源表'?'按旧任务目标类型汇总':'按配置类型汇总';let cards=[...counts].sort((a,b)=>a[0]==='未配置'?1:b[0]==='未配置'?-1:Number(a[0])-Number(b[0])).map(([key,count])=>{let ns=s.name==='每日任务源表'?'EMQCT':'EMISS_DC',e=data.event_candidates.find(x=>x.legacy_key===ns+'_'+key),dict=s.name==='每日任务源表'?src('每日条件字典').records.find(x=>String(x['类型'])===key):null,name=e?.description||('类型 '+key),schema=String(dict?.['参数说明']||'').replace(/^类型[，,]/,'').replace(/（bigmap type）/g,'').replace(/[，,]/g,'、');return `<button class="type-card ${group===key?'active':''}" data-type="${esc(key)}"><strong>${esc(key)} · ${esc(name)}</strong><small>${count} 条配置${schema?' · 参数：'+esc(schema):''}</small></button>`}).join('');let classLine='';if(s.name==='每日任务源表'){let cls=new Map();for(let r of s.records)cls.set(r.type,(cls.get(r.type)||0)+1);classLine=`<div class="field-help">任务分类原值：${[...cls].sort((a,b)=>a[0]-b[0]).map(([k,n])=>`分类 ${k}：${n} 条`).join('；')}。分类名称仍需核对客户端显示与服务端规则。</div>`}return `<div class="type-summary"><h3>${title} · ${counts.size} 种</h3>${classLine}<div class="type-grid"><button class="type-card ${group===null?'active':''}" data-type=""><strong>全部类型</strong><small>${s.count} 条配置</small></button>${cards}</div></div>`}
function typeDetail(s,key){if(key===null)return `<h3>配置详情</h3><div class="hint">点击类型卡片查看该类型的全部配置值；点击任务行查看中文字段和原始数据。</div>`;let matches=s.records.filter(r=>typeOf(r,s.name)===key),ns=s.name==='每日任务源表'?'EMQCT':'EMISS_DC',e=data.event_candidates.find(x=>x.legacy_key===ns+'_'+key),dict=s.name==='每日任务源表'?src('每日条件字典').records.find(x=>String(x['类型'])===key):null,field=s.name==='每日任务源表'?'condition':s.name==='旧任务源表'?'doing_target':'value';return `<h3>${esc(e?.description||'类型 '+key)} · ${matches.length} 条</h3>${dict?.['参数说明']?`<p class="hint">参数：${esc(String(dict['参数说明']).replace(/^类型[，,]/,''))}</p>`:''}<div class="hint">以下列出本类型每条配置的目标值：</div>${matches.map(r=>`<p style="border-top:1px solid #e5ebf3;padding-top:7px;font-size:11px;line-height:1.5"><b>编号 ${esc(r.id??r.type??'')}</b> ${esc(r.des||r.name||r.desc||'')}<br>${esc(shown(field,r[field],s.name))}</p>`).join('')}`}
function records(c,names){if(!selected||!names.includes(selected))selected=names[0];let s=src(selected);let rows=s.records.filter(r=>(group===null||typeOf(r,s.name)===group)&&(!search||JSON.stringify(r).toLowerCase().includes(search.toLowerCase())));let show=()=>{c.innerHTML=`<div class="section-title"><h2>${esc(s.name)} <span class="status ${statusClass(s.status)}">${esc(s.status)}</span></h2><span class="muted">${esc(s.note)}</span></div><div class="toolbar"><select id="sourceSelect">${names.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}</select><input id="search" placeholder="搜索编号、中文描述、条件…" value="${esc(search)}"><span class="count">${rows.length} / ${s.count} 条</span></div>${typeCards(s)}<div class="split"><div>${tableRows(rows,s.columns,s.name)}</div><aside id="detail" class="detail">${typeDetail(s,group)}</aside></div><div class="foot">数据来源：${esc(s.path)}</div>`;$('sourceSelect').onchange=e=>{selected=e.target.value;group=null;search='';page=0;records(c,names)};$('search').oninput=e=>{search=e.target.value;page=0;records(c,names);$('search').focus();$('search').setSelectionRange(search.length,search.length)};document.querySelectorAll('[data-type]').forEach(x=>x.onclick=()=>{group=x.dataset.type||null;page=0;records(c,names)});bindTable(rows,show,s.name)};show()}
function story(c){const names=['章节剧情源表','旧剧情源表','旧剧情服务端导出'];if(!selected||!names.includes(selected))selected=names[0];let s=src(selected),groups=data.dialogue_groups[selected],matchGroups=groups.filter(x=>!search||JSON.stringify(x).toLowerCase().includes(search.toLowerCase()));let rows=s.records.filter(r=>(!group||String(r.dialogid)===group)&&(!search||group||JSON.stringify(r).toLowerCase().includes(search.toLowerCase())));let show=()=>{c.innerHTML=`<div class="section-title"><h2>${esc(s.name)} <span class="status ${statusClass(s.status)}">${esc(s.status)}</span></h2><span class="muted">${groups.length} 组 / ${s.count} 行</span></div><div class="toolbar"><select id="sourceSelect">${names.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}</select><input id="search" placeholder="搜索对话编号或文本…" value="${esc(search)}"><button id="clearGroup" class="tab ${group?'active':''}">${group?'对话 '+esc(group)+' ×':'全部对话'}</button></div><div class="split"><div><div class="muted" style="margin-bottom:9px">对话组：${matchGroups.slice(0,80).map(g=>`<button class="tab ${group===g.id?'active':''}" data-group="${esc(g.id)}">${esc(g.id)} · ${g.count}</button>`).join('')}${matchGroups.length>80?' …':''}</div>${tableRows(rows,s.columns,s.name)}</div><aside id="detail" class="detail"><h3>对白详情</h3><div class="hint">选择对话组，再点击句子查看中文字段说明。</div></aside></div><div class="foot">数据来源：${esc(s.path)}</div>`;$('sourceSelect').onchange=e=>{selected=e.target.value;group=null;search='';page=0;story(c)};$('search').oninput=e=>{search=e.target.value;page=0;story(c);$('search').focus();$('search').setSelectionRange(search.length,search.length)};$('clearGroup').onclick=()=>{group=null;page=0;story(c)};document.querySelectorAll('[data-group]').forEach(x=>x.onclick=()=>{group=x.dataset.group;page=0;story(c)});bindTable(rows,show,s.name)};show()}
function luaDetail(x){
 const parts=[`<h3>${esc(x.file)} · 静态审计</h3><p class="hint">${esc(x.path)}</p><p><b>入口线索</b><br>${esc(x.entry_summary)}</p>`];
 if(x.role_hint)parts.push(`<p><b>脚本用途线索</b><br>${esc(x.role_hint)}<br><span class="hint">这是源码角色判断，仍需运行库或动态入口核对。</span></p>`);
 if(x.npcs.length)parts.push(`<p><b>NPC 源表配置</b><br>${x.npcs.map(n=>esc(n.name)+'（编号 '+esc(n.id)+'；'+(n.export_json?'源表与导出均有':'仅源表有')+'）').join('、')}<br><span class="hint">服务端实际从数据库加载 NPC，仍需核对运行库。</span></p>`);
 if(x.items.length)parts.push(`<p><b>道具源表配置</b><br>${x.items.map(n=>esc(n.name)+'（编号 '+esc(n.id)+'；'+(n.export_json?'源表与导出均有':'仅源表有')+'）').join('、')}</p>`);
 if(x.cpp_sites.length)parts.push(`<p><b>服务端固定编号调用</b></p>`+x.cpp_sites.map(a=>`<p class="hint">${esc(a.path)}:${a.line}<br>${esc(a.text)}</p>`).join(''));
 if(x.required_by.length)parts.push(`<p><b>引用该脚本的模块</b><br>${esc(x.required_by.join('、'))}</p>`);
 if(x.task_ids.length)parts.push(`<p><b>任务编号常量</b><br>${x.task_ids.map(a=>`${esc(a.constant)}＝${esc(a.value??'未解析')}（${a.in_old_task_table?'旧任务表存在':a.in_old_task_table===false?'旧任务表无对应编号':'待核对'}）`).join('<br>')}</p>`);
 if(x.event_ids.length)parts.push(`<p><b>旧目标事件编号</b><br>${x.event_ids.map(a=>`${esc(a.constant)}＝${esc(a.value??'未解析')}`).join('、')}</p>`);
 if(x.data_slots.length)parts.push(`<p><b>通用任务数据槽</b><br>${esc(x.data_slots.join('、'))}<br><span class="hint">这是通用存储编号，不能直接当成任务 ID。</span></p>`);
 if(x.callbacks.length)parts.push(`<p><b>对话回调</b><br>${x.callbacks.map(a=>`${esc(a.name)}（第 ${a.line} 行）`).join('、')}</p>`);
 if(x.unresolved_callbacks.length)parts.push(`<p><b>本文件未定义的回调</b><br>${x.unresolved_callbacks.map(a=>esc(a.name)).join('、')}<br><span class="hint">仍需核对引用模块及实际运行。</span></p>`);
 if(x.task_calls.length)parts.push(`<p><b>任务相关调用 · ${x.task_calls.length} 处</b></p>`+x.task_calls.slice(0,80).map(a=>`<p style="border-top:1px solid #e5ebf3;padding-top:7px;font-size:11px;overflow-wrap:anywhere"><b>${esc(a.kind)} · ${esc(a.function_hint)} 附近 · 第 ${a.line} 行</b><br>${esc(a.text)}</p>`).join('')+(x.task_calls.length>80?'<p class="hint">其余调用可在原始文件查看。</p>':''));
 else parts.push('<p class="hint">未检出任务 API 调用；可能只有任务常量引用或非任务逻辑。</p>');
 return parts.join('');
}
function lua(c){
 if(group===null)group='task';
 const summary=data.lua_summary,config=data.lua_config_checks;
 const files=data.lua.filter(x=>(group==='all'||group==='task'&&x.task_refs.length||group==='entry'&&x.task_refs.length&&x.entry_routes.includes('未解析到静态入口')||group==='old'&&x.action_counts['旧目标推进']||group==='storage'&&x.data_slots.length)&&(!search||JSON.stringify(x).toLowerCase().includes(search.toLowerCase())));
 const rows=files.map(x=>({...x,npc:x.npcs.map(n=>n.name+'（'+n.id+'）').join('、')}));
 const show=()=>{
  c.innerHTML=`<div class="section-title"><h2>服务端 Lua 任务脚本审计</h2><span class="muted">逐文件静态台账 · 运行路径待验证</span></div>
   <div class="notice"><b>Steam 代码链</b> · 打包脚本 ${data.steam_script_check.files} 份，与原服务端逐文件内容一致 ${data.steam_script_check.same_files} 份。Steam 玩法以功能按钮和协议为入口；服务端仍可能直接调用 Lua。</div>
   <div class="table-wrap" style="margin-top:12px"><table class="steam-flow"><thead><tr><th>功能</th><th>Steam 客户端</th><th>服务端</th><th>Lua 判断</th></tr></thead><tbody>${data.steam_flows.map(f=>`<tr><td>${esc(f.feature)}</td><td>${esc(f.client)}</td><td>${esc(f.server)}</td><td>${esc(f.lua)}</td></tr>`).join('')}</tbody></table></div>
   <div class="check"><div>脚本总数<b>${summary.files}</b></div><div>任务相关脚本<b>${summary.task_related_files}</b></div><div>任务 API 调用<b>${summary.task_api_call_sites}</b></div><div>有 NPC 源表配置的任务脚本<b>${summary.npc_config_task_files}</b></div><div>旧目标推进脚本<b>${summary.old_target_emit_files}</b></div><div>通用数据槽脚本<b>${summary.legacy_storage_files}</b></div></div>
   <div class="notice" style="margin-top:15px">NPC 源表关联 ${config.npc_source_scripts} 个脚本，当前导出仅 ${config.npc_export_scripts} 个；缺少镖头脚本 ${esc(config.npc_source_only.join('、'))}。道具源表关联 ${config.item_source_scripts} 个脚本，当前道具导出的脚本字段均为 0。服务端实际读数据库，仍需核对运行库。</div>
   <div class="toolbar"><select id="luaFilter"><option value="task" ${group==='task'?'selected':''}>任务相关脚本</option><option value="all" ${group==='all'?'selected':''}>全部脚本</option><option value="entry" ${group==='entry'?'selected':''}>任务脚本入口待核对</option><option value="old" ${group==='old'?'selected':''}>旧目标推进</option><option value="storage" ${group==='storage'?'selected':''}>通用数据槽</option></select><input id="search" placeholder="搜索文件、任务编号、调用、NPC…" value="${esc(search)}"><span class="count">${rows.length} 个脚本</span></div>
   <div class="split"><div>${tableRows(rows,['file','entry_summary','task_call_count','npc'],'Lua脚本')}</div><aside id="detail" class="detail"><h3>逐文件证据</h3><div class="hint">点击脚本查看源表入口、导出差异、任务编号、回调、数据槽与调用行。所有结论目前均为静态证据。</div></aside></div>`;
  $('luaFilter').onchange=e=>{group=e.target.value;page=0;lua(c)};
  $('search').oninput=e=>{search=e.target.value;page=0;lua(c);$('search').focus();$('search').setSelectionRange(search.length,search.length)};
  document.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>{$('detail').innerHTML=luaDetail(rows[+el.dataset.row])});
  $('prev').onclick=()=>{page--;show()};$('next').onclick=()=>{page++;show()};
 };
 show();
}
function checks(c){let x=data.checks;c.innerHTML=`<div class="section-title"><h2>源表与导出核对</h2><span class="muted">结构读取与静态统计</span></div><div class="check"><div>每日源表编号<b>${x.daily_source_ids}</b></div><div>服务端导出编号<b>${x.daily_export_ids}</b></div><div>源表独有编号<b>${x.daily_only_ids.length}</b></div><div>导出独有编号<b>${x.export_only_ids.length}</b></div><div>每日条件类型<b>${x.daily_condition_types.length}</b></div><div>Lua 任务相关行<b>${x.lua_task_ref_lines}</b></div></div><h3 style="font-size:14px;margin-top:30px">每日条件类型 · 实际引用数</h3><div class="table-wrap"><table><thead><tr><th>条件编号</th><th>条件名称</th><th>引用任务数</th></tr></thead><tbody>${x.daily_condition_types.map(r=>{let e=data.event_candidates.find(y=>y.legacy_key==='EMQCT_'+r.id);return `<tr><td>${r.id}</td><td>${esc(e?.description||'待核对')}</td><td>${r.tasks}</td></tr>`}).join('')}</tbody></table></div><h3 style="font-size:14px;margin-top:30px">当前不能断言的范围</h3><ul class="warning-list">${data.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><p class="muted">此页不执行 Lua，不模拟任务状态机，也不修改 Excel、JSON、XML 或 Unity 工程。</p>`}
async function load(){try{let r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();if(data.error)throw Error(data.error);let v=[['每日源任务',src('每日任务源表').count],['旧任务',src('旧任务源表').count],['章节剧情行',src('章节剧情源表').count],['旧剧情行',src('旧剧情源表').count],['Lua 脚本',data.checks.lua_files]];$('metrics').innerHTML=v.map(([label,value])=>`<div class="metric"><span class="label">${label}</span><strong>${value}</strong><small>已读取的原始记录</small></div>`).join('');$('notice').innerHTML=`<strong>解析边界：</strong>Excel / JSON / XML 逐行结构读取；Lua 静态扫描。${esc(data.warnings[0])}`;$('foot').textContent='读取时间 '+new Date(data.generated_at).toLocaleString()+' · 只读 · 项目 '+data.root;render()}catch(e){$('content').innerHTML='<div class="empty">读取失败：'+esc(e.message)+'</div>'}}$('refresh').onclick=load;load();
</script></body></html>
