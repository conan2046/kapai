<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一任务 · 策划配置</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#243750;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cedbeb;background:#fff;border-radius:9px;padding:9px 13px;color:#24517f}button:hover{border-color:#79a5da}button.primary{background:#255b97;color:#fff;border-color:#255b97}button.danger{color:#a64040}input,select,textarea{border:1px solid #cdd9e9;border-radius:8px;padding:9px;color:#213850;background:#fff;width:100%}textarea{min-height:78px;resize:vertical}.shell{max-width:1600px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.top h1{font-size:23px;margin:0}.sub,.hint,.foot{color:#7688a0;font-size:12px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.banner{background:#eaf2fd;border:1px solid #d0e0f7;border-radius:11px;padding:12px 15px;margin-bottom:14px;font-size:13px}.banner.error{background:#fff1ee;border-color:#edc5bd;color:#a2352c}.scope{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.scope span{background:#fff;border:1px solid #dfe7f1;border-radius:20px;padding:7px 12px;font-size:12px}.scope b{color:#1e5ca0}.layout{display:grid;grid-template-columns:215px minmax(320px,1fr) minmax(380px,1.05fr);gap:14px}.card{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:17px;min-width:0}.card h2{font-size:16px;margin:0 0 12px}.nav{display:grid;gap:7px}.nav button{text-align:left;display:flex;justify-content:space-between}.nav button.on,.list button.on{background:#e8f2ff;border-color:#77a5dc}.nav .group{font-size:11px;color:#8795a9;font-weight:700;margin:10px 0 2px}.list{overflow:auto;max-height:69vh;display:flex;flex-direction:column;gap:6px;margin-top:10px}.list button{display:block;flex:none;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list small{display:block;color:#7c8da4;margin-top:3px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-height:67vh;overflow:auto;padding-right:3px}.form label{font-size:12px;color:#5b718c;font-weight:700}.form label span{display:block;margin-bottom:5px}.form label.wide{grid-column:span 2}.form .explain{font-weight:400;color:#8999aa;font-size:11px;margin-top:4px}.parameter,.flow{border-top:1px solid #e4eaf2;margin-top:18px;padding-top:14px}.parameter h3,.flow h3{font-size:14px;margin:0 0 9px}.parameter .item{border:1px solid #dce7f4;background:#f7faff;border-radius:9px;padding:10px 12px;margin:7px 0;font-size:12px;line-height:1.65}.parameter .item b{color:#245b99}.flow-rail{display:flex;align-items:center;gap:8px;overflow:auto;padding:9px 0}.node{flex:none;border:1px solid #bad0eb;background:#f1f7ff;border-radius:9px;padding:10px 12px;min-width:110px;font-size:12px}.node b{display:block;color:#2b629f}.arrow{color:#91a7c1}.dialogue{background:#f7f9fd;border:1px solid #e1e8f1;border-radius:8px;padding:10px;max-height:160px;overflow:auto;font-size:12px;line-height:1.65}.foot{margin-top:12px;overflow-wrap:anywhere}@media(max-width:1100px){.layout{grid-template-columns:200px 1fr}.detail{grid-column:1/-1}}@media(max-width:650px){.top{display:block}.actions{margin-top:12px}.layout{grid-template-columns:1fr}.detail{grid-column:auto}.list,.form{max-height:42vh}}
</style>
<style>.param-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:9px}.param-fields label{font-size:11px;color:#5b718c}.param-fields label span{display:block;margin-bottom:4px}.advanced{grid-column:1/-1;border-top:1px solid #e4eaf2;padding-top:10px;color:#6c8098;font-size:12px}.advanced summary{cursor:pointer}.advanced-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.advanced-grid label.wide{grid-column:1/-1}.dialogue-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0}.dialogue-toolbar b{margin-right:auto}.dialogue-line{padding:12px 0}.dialogue-line .param-fields{grid-template-columns:minmax(110px,.65fr) minmax(220px,1.35fr)}.dialogue-line textarea{min-height:70px}.dialogue-line details{margin:8px 0}.dialogue-line summary{cursor:pointer;color:#6c8098}.dialogue-group-header{grid-column:1/-1}.dialogue-slots{display:grid;gap:10px}.dialogue-slot{border:1px solid #dce7f4;background:#f7faff;border-radius:9px;padding:12px}.dialogue-slot h4{font-size:13px;margin:0 0 10px;color:#255b97}.dialogue-slot label{display:block;font-size:12px;color:#5b718c}.dialogue-slot label span{display:block;margin-bottom:5px}.dialogue-slot .dialogue{margin:10px 0}.dialogue-slot .dialogue div{margin-top:5px}button:disabled{cursor:default;opacity:.5}@media(max-width:650px){.param-fields,.advanced-grid,.dialogue-line .param-fields{grid-template-columns:1fr}}</style>
<style>
.flow .item{border:1px solid #dce7f4;background:#f7faff;border-radius:9px;padding:10px 12px;margin:7px 0;font-size:12px;line-height:1.65}
#workflowArea .flow{border-top:0;margin-top:0;padding-top:0}
#workflowArea .flow-rail{border-top:1px solid #e4eaf2;margin-top:14px;padding-top:14px}
</style>
</head>
<body><div class="shell"><header class="top"><div><h1>统一任务 · 策划配置</h1><div class="sub">任务类型：主线、支线、日常、累计。任务目标引用统一事件类型，已屏蔽模块的事件只保留在迁移核对中。</div></div><div class="actions"><button id="audit">查看旧数据审计</button><button id="check">校验配置</button><button id="preview">导出预览</button><button id="save" class="primary">保存 Excel</button><button id="download">下载 Excel</button></div></header><div id="status" class="banner">读取工作簿中…</div><div id="scope" class="scope"></div><div class="layout"><aside class="card"><h2>策划配置</h2><nav id="nav" class="nav"></nav><p class="hint">事件范围与定义状态分别管理；草稿可预览，只有运行验收后的内容才进入正式导出。</p><button id="release">生成正式导出</button></aside><section class="card"><h2 id="listTitle">配置记录</h2><input id="search" placeholder="搜索中文名称、编号、正文…"><div style="display:flex;gap:7px;margin-top:9px"><button id="add">新增配置</button><button id="remove" class="danger">删除所选</button></div><div id="list" class="list"></div></section><section class="card detail"><h2 id="formTitle">配置详情</h2><div id="form" class="form"></div><div id="previewArea"></div></section></div><div id="foot" class="foot"></div></div><script src="/editor.js"></script></body>
</html>
