[server]
host = 127.0.0.1
port = 8711
; 必须与服务端配置 server.server_id 一致(默认 1)
server_id = 1

[gm]
; 本地登录用的账号 id(本地模式免口令, 服务端据此建号并绑定会话)
account_id = 1
; admin 表里的 GM 账号(userId 列)与口令
; 口令明文传输, 服务端自行算哈希后比对。登录失败不会自动修改 admin 表。
; 旧存档请显式执行 docs/gm-backend/migrate_admin.py 后再登录。
gm_user_id = 1
gm_password = gm123456

[web]
; Web 后台监听地址(仅本机)
; 注意: 8080 已被 Unity MCP(mcp-for-unity http transport)占用, 不要用 8080
listen_host = 127.0.0.1
listen_port = 8081
; 若上面端口被占用, 依次尝试以下备用端口(逗号分隔)
fallback_ports = 8088,18080,8899,9000,9527
; 启动后自动打开浏览器: 1=开, 0=关
auto_open = 1
